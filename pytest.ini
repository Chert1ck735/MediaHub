[pytest]
asyncio_mode = auto
pythonpath = .
# importlib: без него два файла с одинаковым именем в разных папках
# (tests/telegram/test_links.py и tests/vk/unit/test_links.py) ломают сборку
# всего набора, и ни один тест не запускается.
addopts = --import-mode=importlib
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:sqlalchemy.*
markers =
    integration: integration tests
