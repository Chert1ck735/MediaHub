stages:
  - build
  - deploy

variables:
  ORIGIN_URL: https://gitlab-ci-token:$CI_JOB_TOKEN@repos.krskcit.ru/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME.git

build:
  stage: build
  tags:
    - dind
  script:
    - echo "$CI_JOB_TOKEN" | docker login $CI_REGISTRY -u gitlab-ci-token --password-stdin
    - docker build -f backend/Dockerfile -t $CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:backend_latest .
    - docker image push $CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:backend_latest
    # Диагностика: если в базовом образе задан NODE_ENV=production, npm
    # пропускает devDependencies — именно так однажды пропал vite.
    - docker run --rm repos.krskcit.ru:5050/open/docker-images:node_20-bookworm-slim printenv NODE_ENV || echo 'NODE_ENV в базовом образе не задан'
    - cd frontend
    - docker build -t $CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:frontend_latest .
    - docker image push $CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:frontend_latest
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: always
    - when: never

deploy:
  stage: deploy
  tags:
    - stud
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan "$DEPLOY_SERVER" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      printf -v remote_deploy_path '%q' "$DEPLOY_PATH"
      printf -v remote_origin_url '%q' "$ORIGIN_URL"
      printf -v remote_registry '%q' "$CI_REGISTRY"
      printf -v remote_job_token '%q' "$CI_JOB_TOKEN"

      ssh "$DEPLOY_USER@$DEPLOY_SERVER" \
        "DEPLOY_PATH=$remote_deploy_path ORIGIN_URL=$remote_origin_url CI_REGISTRY=$remote_registry CI_JOB_TOKEN=$remote_job_token bash -s" <<'REMOTE_SCRIPT'
      set -eu

      cd "$DEPLOY_PATH"
      sudo git remote set-url origin "$ORIGIN_URL"
      sudo git pull --ff-only

      printf '%s\n' "$CI_JOB_TOKEN" | \
        docker login "$CI_REGISTRY" -u gitlab-ci-token --password-stdin

      compose=(docker compose -f docker-compose-prod.yml)
      "${compose[@]}" pull </dev/null

      echo "Alembic heads in the pulled backend image:"
      "${compose[@]}" run --rm --no-deps --interactive=false -T \
        migrations alembic heads --verbose </dev/null

      if ! "${compose[@]}" up \
        --no-deps \
        --force-recreate \
        --abort-on-container-exit \
        --exit-code-from migrations \
        migrations </dev/null; then
        "${compose[@]}" logs \
          --no-color --timestamps --tail=200 migrations || true
        exit 1
      fi

      # --force-recreate: без него compose оставляет бэкенд как есть, если
      # образ не менялся. А зависший с прошлого раза контейнер выглядит как
      # Running, и деплой «проходит», пока сайт отдаёт 502.
      "${compose[@]}" up -d --no-deps --force-recreate backend frontend </dev/null

      # Порт начинает слушаться только после ensure_runtime_schema: она
      # выполняет DDL по comments и comment_analysis и может ждать блокировку,
      # которую держит долгая транзакция классификации. Ждём готовности и,
      # если не дождались, печатаем лог — иначе причина не видна.
      ready=0
      for _ in $(seq 1 30); do
        if "${compose[@]}" exec -T backend python -c \
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)" \
          </dev/null >/dev/null 2>&1; then
          ready=1
          break
        fi
        sleep 5
      done

      if [ "$ready" -ne 1 ]; then
        echo "Бэкенд не начал отвечать за 150 секунд. Последние строки лога:"
        "${compose[@]}" logs --no-color --timestamps --tail=100 backend </dev/null || true
        echo "Открытые транзакции в базе (первые — самые старые):"
        "${compose[@]}" exec -T backend python -c 'import os, psycopg2; c = psycopg2.connect(dbname=os.environ["DB_NAME"], user=os.environ["DB_USER"], password=os.environ["DB_PASS"], host=os.environ["DB_HOST"]); k = c.cursor(); k.execute("select pid, state, now() - xact_start as age, left(query, 90) from pg_stat_activity where xact_start is not null order by xact_start limit 10"); [print(r) for r in k.fetchall()]' </dev/null || true
        exit 1
      fi

      echo "Бэкенд отвечает."

      # Наружу смотрит только фронт (5173) — он же проксирует /api в бэкенд.
      # Живой бэкенд ещё не значит, что сайт открывается.
      front=0
      for _ in $(seq 1 24); do
        if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:5173/ </dev/null 2>/dev/null; then
          front=1
          break
        fi
        sleep 5
      done

      if [ "$front" -ne 1 ]; then
        echo "Фронт не отвечает на 5173 за 120 секунд. Состояние контейнеров:"
        "${compose[@]}" ps </dev/null || true
        echo "Лог фронта:"
        "${compose[@]}" logs --no-color --timestamps --tail=100 frontend </dev/null || true
        exit 1
      fi

      echo "Фронт отвечает. Прод поднят."
      REMOTE_SCRIPT
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: on_success
    - when: never
